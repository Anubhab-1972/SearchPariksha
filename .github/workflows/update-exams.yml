# GitHub Actions Workflow: Auto-Update Exam Dates
# This runs on Mon, Wed, Fri, Sun at 2:00 AM IST (8:30 PM UTC previous day)
# and uses Gemini AI to search the internet for the latest exam dates.

name: Update Exam Dates

on:
  schedule:
    # Runs at 8:30 PM UTC on Sun, Tue, Thu, Sat (which is Mon, Wed, Fri, Sun 2:00 AM IST)
    - cron: '30 20 * * 0,2,4,6'
  
  # Also allows manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  update-exams:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-genai

      - name: Debug - Show installed package versions
        run: pip show google-genai

      - name: Run exam updater script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_exams.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Exam Bot"
          git add exams.json
          git diff --cached --quiet || (git commit -m "🤖 Auto-update exam dates [$(date +'%Y-%m-%d')]" && git push)
